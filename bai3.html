<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      div {
        border: 1px solid red;
        margin-left: 100px;
      }
      p.ex1 {
        margin-left: inherit;
      }
    </style>
    <title>bai tap CSS 3</title>
  </head>
  <body>
    <h2>Use of the inherit value</h2>
    <p>Let the left margin be inherited from the parent element:</p>
    <div>
      <p class="ex1">
        This paragraph has an inherited left margins (from the div element).
      </p>
    </div>
  </body>
</html>
